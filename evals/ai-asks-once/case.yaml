schema_version: "1.1"
name: ai-asks-once
description: An ambiguous architectural request in AI mode raises its major decisions in one batch before any code.
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
